name: Bot2 Live (ICT-SMC v2 -> Tabdeal)

on:
  workflow_dispatch: {}
  # ⚠️ کرون داخلی گیت‌هاب حذف شد چون غیرقابل‌اعتماده. از cron-job.org استفاده کن:
  # POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/bot2_live.yml/dispatches
  # هدرها: Authorization: token <YOUR_GITHUB_PAT> و Accept: application/vnd.github+json
  # بادی: {"ref": "main"}

permissions:
  contents: write

concurrency:
  group: bot2-live-tabdeal
  cancel-in-progress: false

jobs:
  run-bot2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot2 live trader
        env:
          TABDEAL_API_KEY: ${{ secrets.TABDEAL_API_KEY }}
          TABDEAL_API_SECRET: ${{ secrets.TABDEAL_API_SECRET }}
          TABDEAL_DRY_RUN: ${{ vars.TABDEAL_DRY_RUN }}
          TABDEAL_HARD_CAP_MARGIN_USDT: ${{ vars.TABDEAL_HARD_CAP_MARGIN_USDT }}
          BOT2_ST_MARGIN_USDT: ${{ vars.BOT2_ST_MARGIN_USDT }}
          BOT2_ST_LEVERAGE: ${{ vars.BOT2_ST_LEVERAGE }}
          BOT2_SMC_MARGIN_USDT: ${{ vars.BOT2_SMC_MARGIN_USDT }}
          BOT2_SMC_LEVERAGE: ${{ vars.BOT2_SMC_LEVERAGE }}
          PAPER_STARTING_BALANCE_USDT: ${{ vars.PAPER_STARTING_BALANCE_USDT }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ vars.TELEGRAM_CHAT_ID_2 }}
        run: python bot2_live/live_trader.py

      - name: Commit updated state and paper log
        run: |
          git config user.name "bot2-live"
          git config user.email "bot2-live@users.noreply.github.com"
          git add bot2_live/state.json
          [ -f bot2_live/paper_trades_log.csv ] && git add bot2_live/paper_trades_log.csv
          if git diff --staged --quiet; then
            echo "تغییری در وضعیت نبود."
            exit 0
          fi
          git commit -m "update bot2 state/paper log [skip ci]"
          # اگه هم‌زمان یه commit دیگه (مثلاً ویرایش دستی یا اجرای دیگه) روی
          # همین فایل‌ها landed شده باشه، rebase/push ممکنه شکست بخوره. به‌جای
          # اینکه کل نتیجه‌ی این اجرا (پوزیشن‌های باز/بسته‌شده‌ش) دور ریخته بشه،
          # چند بار دوباره تلاش می‌کنیم.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "✅ push موفق شد (تلاش $i)."
              exit 0
            fi
            echo "⚠️ تلاش $i برای pull/push ناموفق بود (احتمالاً تداخل با یه commit هم‌زمان)، بعد از کمی صبر دوباره امتحان می‌کنیم."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "⚠️ بعد از چند تلاش هم push معمولی جواب نداد. چون bot2_live/state.json و paper_trades_log.csv فقط دست خودِ این بات هستن (نه هیچ فایل دیگه‌ای)، نسخه‌ی همین اجرا رو با force-with-lease ثبت می‌کنیم تا نتیجه‌ی این اجرا گم نشه."
          git fetch origin main
          git push --force-with-lease origin HEAD:main
